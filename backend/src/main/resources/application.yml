server:
  port: 8080

spring:
  application:
    name: caddie-backend
  datasource:
    # Values come from environment variables; the defaults match .env.example
    url: ${DB_URL:jdbc:mysql://localhost:3306/caddie}
    username: ${DB_USERNAME:caddie}
    password: ${DB_PASSWORD:change-me}
  jpa:
    # Flyway owns the schema. Hibernate only checks the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Dublin
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  # "production" makes the backend refuse to start with any development default still set
  # (config/ProductionSafetyCheck).
  environment: ${APP_ENVIRONMENT:development}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-at-least-32-chars}
    expiry-days: 90         # caddies "log in once and stay logged in"
    admin-expiry-hours: 12  # admins: the board may be on a shared PC
  # Wrong passwords/setup codes: this many on one phone number locks it for lock-minutes.
  login:
    max-attempts: 5
    lock-minutes: 15
  # One-time setup codes for new caddies / password resets stop working after this.
  setup-code-valid-hours: 48
  # "Not coming in" must be at least this far ahead of the start of the day.
  absence:
    min-notice-hours: 24
  # Websites allowed to call the API from a browser (CORS): the admin board's address, comma
  # separated, e.g. https://caddies.yourclub.ie. Phones don't need this. Dev default: localhost.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  # Push notifications through Expo's push service when a caddie is called.
  push:
    enabled: ${PUSH_ENABLED:true}
  timezone: Europe/Dublin
  # "I'm here" only works inside this circle. Set here on purpose so admins can't change it.
  # TODO: put in the club's real coordinates (e.g. the caddie shack - right-click it in Google
  # Maps to copy them), then set require-location to true.
  check-in:
    require-location: ${CHECKIN_REQUIRE_LOCATION:false}
    latitude: 53.0
    longitude: -6.0
    radius-meters: 400
  # The club list's order, day columns and "bags today" all update once a day at this time
  # (queue/ClubListRecalculation). Bags entered after it count from the next day's update.
  club-list:
    daily-update-time: "16:00"
  # First admin, created on start-up only if the database has no admin yet.
  # They must choose a new password on first login. Override all three in production.
  bootstrap-admin:
    name: ${BOOTSTRAP_ADMIN_NAME:Caddie Master}
    phone: ${BOOTSTRAP_ADMIN_PHONE:0870000000}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:admin1234}
